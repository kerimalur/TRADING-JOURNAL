<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0c;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    
    .splash-container {
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3); }
      50% { transform: scale(1.03); box-shadow: 0 25px 60px rgba(139, 92, 246, 0.4); }
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      color: #FAFAFA;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 13px;
      color: #71717A;
      margin-bottom: 40px;
    }
    
    .loader {
      width: 180px;
      height: 3px;
      background: rgba(139, 92, 246, 0.15);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
    }
    
    .loader-bar {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #8B5CF6, #A78BFA);
      border-radius: 2px;
      animation: loading 1.2s infinite ease-in-out;
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    
    .loading-text {
      margin-top: 16px;
      font-size: 12px;
      color: #52525B;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .version {
      margin-top: 40px;
      font-size: 11px;
      color: #3f3f46;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">TJ</div>
    <h1 class="title">Trading Journal</h1>
    <p class="subtitle">Professional Trading Analytics</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <p class="loading-text">Loading...</p>
    <p class="version">v1.2.0</p>
  </div>
</body>
</html>
