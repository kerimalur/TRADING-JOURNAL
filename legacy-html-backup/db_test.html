<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Migration Test</title>
    
    <!-- WICHTIG: Richtige Reihenfolge der Scripts -->
    
    <!-- 1. Dexie.js (IndexedDB Library) -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    
    <!-- 2. Database Layer -->
    <script src="db.js"></script>
    
    <!-- 3. Migration Script -->
    <script src="migration.js"></script>
    
    <!-- 4. Data Manager (Compatibility Layer) -->
    <script src="data_manager.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1d23 0%, #0f1114 100%);
            color: #e0e0e0;
            padding: 40px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(30, 34, 42, 0.95);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        h2 {
            color: #64B5F6;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
        }
        
        .subtitle {
            color: #9E9E9E;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .status-box {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4CAF50;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        
        .status-box.warning {
            background: rgba(255, 152, 0, 0.1);
            border-left-color: #FF9800;
        }
        
        .status-box.error {
            background: rgba(244, 67, 54, 0.1);
            border-left-color: #F44336;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        button.secondary {
            background: linear-gradient(135deg, #64B5F6 0%, #42A5F5 100%);
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.3);
        }
        
        button.danger {
            background: linear-gradient(135deg, #F44336 0%, #E53935 100%);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: rgba(100, 181, 246, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 181, 246, 0.2);
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #4CAF50;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #9E9E9E;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #log {
            background: #1a1d23;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 5px 0;
        }
        
        .log-success { color: #4CAF50; }
        .log-error { color: #F44336; }
        .log-warning { color: #FF9800; }
        .log-info { color: #64B5F6; }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ Database Migration Test</h1>
        <p class="subtitle">IndexedDB Migration & Testing Dashboard</p>
        
        <!-- Status -->
        <div id="statusBox" class="status-box">
            <h3>Status: Initialisierung...</h3>
            <p id="statusText">Prüfe Datenbank...</p>
        </div>
        
        <div class="loader" id="loader"></div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Trades (IndexedDB)</div>
                <div class="stat-value" id="dbTradesCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Screenshots</div>
                <div class="stat-value" id="dbScreenshotsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">COT Einträge</div>
                <div class="stat-value" id="dbCotCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Speicher (MB)</div>
                <div class="stat-value" id="storageUsed">0</div>
            </div>
        </div>
        
        <!-- Actions -->
        <h2>🔧 Aktionen</h2>
        <div class="button-group">
            <button onclick="testDatabaseConnection()">🔌 Verbindung testen</button>
            <button onclick="checkMigrationStatus()">📊 Migration-Status</button>
            <button onclick="runMigration()" class="secondary">▶️ Migration starten</button>
            <button onclick="testTradeCreation()" class="secondary">➕ Test-Trade erstellen</button>
            <button onclick="viewAllData()">👁️ Alle Daten anzeigen</button>
            <button onclick="resetMigration()" class="danger">🔄 Migration zurücksetzen</button>
            <button onclick="clearDatabase()" class="danger">🗑️ DB löschen</button>
        </div>
        
        <!-- Log -->
        <h2>📝 Log</h2>
        <div id="log"></div>
    </div>
    
    <script>
        // ============================================================
        // LOGGING HELPER
        // ============================================================
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `[${timestamp}] ${message}`;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(`[${type.toUpperCase()}]`, message);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }
        
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }
        
        function updateStatus(title, text, type = 'success') {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = `status-box ${type}`;
            statusBox.querySelector('h3').textContent = title;
            document.getElementById('statusText').textContent = text;
        }
        
        // ============================================================
        // DATABASE TESTS
        // ============================================================
        
        async function testDatabaseConnection() {
            clearLog();
            showLoader();
            log('Teste Datenbank-Verbindung...', 'info');
            
            try {
                await db.open();
                log('✅ Datenbank erfolgreich geöffnet', 'success');
                log(`Database Name: ${db.name}`, 'info');
                log(`Version: ${db.verno}`, 'info');
                log(`Tables: ${db.tables.map(t => t.name).join(', ')}`, 'info');
                
                updateStatus('Status: Verbunden', 'Datenbank ist einsatzbereit', 'success');
                await updateStats();
            } catch (error) {
                log(`❌ Fehler: ${error.message}`, 'error');
                updateStatus('Status: Fehler', error.message, 'error');
            }
            
            hideLoader();
        }
        
        async function checkMigrationStatus() {
            clearLog();
            log('Prüfe Migration-Status...', 'info');
            
            const isComplete = isMigrationComplete();
            
            if (isComplete) {
                log('✅ Migration wurde bereits durchgeführt', 'success');
                updateStatus('Status: Migration abgeschlossen', 'Alle Daten wurden migriert', 'success');
            } else {
                log('⚠️ Migration wurde noch nicht durchgeführt', 'warning');
                updateStatus('Status: Migration ausstehend', 'Klicken Sie auf "Migration starten"', 'warning');
            }
            
            await updateStats();
        }
        
        async function runMigration() {
            clearLog();
            showLoader();
            log('Starte Migration...', 'info');
            
            try {
                const report = await migrateAllData();
                
                log('Migration abgeschlossen!', 'success');
                log(`Trades: ${report.trades.success} erfolgreich, ${report.trades.failed} fehlgeschlagen`, 'info');
                log(`Screenshots: ${report.screenshots.success} erfolgreich`, 'info');
                log(`COT Data: ${report.cotData.success} erfolgreich`, 'info');
                log(`News: ${report.newsData.success} erfolgreich`, 'info');
                log(`Transactions: ${report.transactions.success} erfolgreich`, 'info');
                
                if (report.errors.length > 0) {
                    log(`⚠️ ${report.errors.length} Fehler aufgetreten`, 'warning');
                    report.errors.forEach(err => log(err, 'error'));
                }
                
                updateStatus('Status: Migration erfolgreich', `${report.trades.success + report.cotData.success + report.newsData.success} Einträge migriert`, 'success');
                await updateStats();
            } catch (error) {
                log(`❌ Migration fehlgeschlagen: ${error.message}`, 'error');
                updateStatus('Status: Fehler', error.message, 'error');
            }
            
            hideLoader();
        }
        
        async function testTradeCreation() {
            clearLog();
            showLoader();
            log('Erstelle Test-Trade...', 'info');
            
            try {
                const testTrade = {
                    type: 'ek',
                    pair: 'EURUSD',
                    date: new Date().toISOString().split('T')[0],
                    direction: 'long',
                    rMultiple: 2.5,
                    riskPercent: 1.0,
                    setup: 'Test-Setup',
                    notes: 'Automatisch generierter Test-Trade'
                };
                
                const tradeId = await dbSaveTrade(testTrade);
                log(`✅ Test-Trade erstellt (ID: ${tradeId})`, 'success');
                
                // Lade Trade zurück
                const trades = await dbLoadTrades();
                const savedTrade = trades.find(t => t.id === tradeId);
                
                if (savedTrade) {
                    log('✅ Trade erfolgreich geladen', 'success');
                    log(JSON.stringify(savedTrade, null, 2), 'info');
                } else {
                    log('❌ Trade konnte nicht geladen werden', 'error');
                }
                
                updateStatus('Status: Test erfolgreich', 'Test-Trade wurde erstellt', 'success');
                await updateStats();
            } catch (error) {
                log(`❌ Fehler: ${error.message}`, 'error');
                updateStatus('Status: Fehler', error.message, 'error');
            }
            
            hideLoader();
        }
        
        async function viewAllData() {
            clearLog();
            showLoader();
            log('Lade alle Daten...', 'info');
            
            try {
                const trades = await db.trades.toArray();
                const backtests = await db.backtests.toArray();
                const screenshots = await db.screenshots.toArray();
                const cotData = await db.cotData.toArray();
                const newsData = await db.newsData.toArray();
                
                log(`=== TRADES (${trades.length}) ===`, 'info');
                trades.slice(0, 5).forEach(t => {
                    log(`ID: ${t.id} | ${t.pair} | ${t.date} | R: ${t.rMultiple}`, 'info');
                });
                if (trades.length > 5) log(`... und ${trades.length - 5} weitere`, 'info');
                
                log(`=== BACKTESTS (${backtests.length}) ===`, 'info');
                log(`=== SCREENSHOTS (${screenshots.length}) ===`, 'info');
                screenshots.slice(0, 3).forEach(s => {
                    log(`ID: ${s.id} | Trade: ${s.tradeId} | Size: ${(s.size / 1024).toFixed(2)} KB`, 'info');
                });
                
                log(`=== COT DATA (${cotData.length}) ===`, 'info');
                log(`=== NEWS DATA (${newsData.length}) ===`, 'info');
                
                updateStatus('Status: Daten geladen', 'Siehe Log für Details', 'success');
            } catch (error) {
                log(`❌ Fehler: ${error.message}`, 'error');
            }
            
            hideLoader();
        }
        
        async function resetMigration() {
            if (!confirm('Migration-Flag zurücksetzen? Migration läuft beim nächsten Reload.')) return;
            
            clearLog();
            resetMigrationFlag();
            log('✅ Migration-Flag zurückgesetzt', 'success');
            updateStatus('Status: Flag zurückgesetzt', 'Migration läuft beim nächsten Reload', 'warning');
        }
        
        async function clearDatabase() {
            await clearAllDatabaseData();
        }
        
        // ============================================================
        // STATS UPDATE
        // ============================================================
        
        async function updateStats() {
            try {
                const tradesCount = await db.trades.count();
                const screenshotsCount = await db.screenshots.count();
                const cotCount = await db.cotData.count();
                
                document.getElementById('dbTradesCount').textContent = tradesCount;
                document.getElementById('dbScreenshotsCount').textContent = screenshotsCount;
                document.getElementById('dbCotCount').textContent = cotCount;
                
                // Storage Estimate
                if (navigator.storage && navigator.storage.estimate) {
                    const estimate = await navigator.storage.estimate();
                    const usedMB = (estimate.usage / 1024 / 1024).toFixed(2);
                    document.getElementById('storageUsed').textContent = usedMB;
                }
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }
        
        // ============================================================
        // INIT
        // ============================================================
        
        window.addEventListener('DOMContentLoaded', async () => {
            log('Dashboard geladen', 'info');
            log('Warte auf Migration...', 'info');
            
            // Warte kurz, damit Migration abgeschlossen ist
            setTimeout(async () => {
                await checkMigrationStatus();
                log('Bereit für Tests', 'success');
            }, 2000);
        });
    </script>
</body>
</html>
